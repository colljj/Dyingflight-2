name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: arrange project files
        run: |
          mkdir -p src/client/java/com/example/dynflight src/main/resources
          mv DynFlightClient.java src/client/java/com/example/dynflight/
          mv fabric.mod.json src/main/resources/
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: build
        run: gradle build
      - name: upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: decompile minecraft sources
        continue-on-error: true
        run: |
          gradle genSources
          mkdir -p out tmp
          for jar in $(find ~/.gradle .gradle -name '*sources*.jar' 2>/dev/null | grep -i minecraft); do
            unzip -qo "$jar" -d tmp || true
          done
          for name in PlayerModel HumanoidModel AvatarRenderer AvatarRenderState LivingEntityRenderer; do
            find tmp -name "$name.java" -exec cp {} out/ \;
          done
          ls -la out
      - name: upload sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MC-sources
          path: out/
          if-no-files-found: ignore
